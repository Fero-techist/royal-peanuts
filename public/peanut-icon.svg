<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Circular Burnt Orange background with subtle radial gradient -->
  <defs>
    <radialGradient id="burntOrangeBg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D96338"/>
      <stop offset="60%" stop-color="#C2542D"/>
      <stop offset="100%" stop-color="#8C3A1A"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#78350F" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="64" height="64" rx="16" fill="url(#burntOrangeBg)"/>
  
  <!-- Outer Gold Rim -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#F1D688" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Stylized Royal Crown in gleaming gold -->
  <g filter="url(#goldGlow)">
    <path d="M16 42L19 24L26 31L32 18L38 31L45 24L48 42H16Z" fill="url(#goldGradient)"/>
    <!-- Crown Jewels / Orbs -->
    <circle cx="19" cy="22" r="2.2" fill="#FFFBEB"/>
    <circle cx="32" cy="16" r="2.8" fill="#FFFBEB"/>
    <circle cx="45" cy="22" r="2.2" fill="#FFFBEB"/>
    <!-- Crown Base Band -->
    <rect x="16" y="42" width="32" height="4" rx="2" fill="#D4AF37"/>
    <circle cx="24" cy="44" r="1.2" fill="#78350F"/>
    <circle cx="32" cy="44" r="1.2" fill="#78350F"/>
    <circle cx="40" cy="44" r="1.2" fill="#78350F"/>
  </g>
</svg>

